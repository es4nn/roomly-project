<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roomly · v2</title><style>:root{font-family:system-ui;color:#233044;background:#f5f7fa}body{max-width:900px;margin:40px auto;padding:20px}h1{color:#2166df}section{margin:25px 0;padding:20px;background:white;border:1px solid #dfe5ee;border-radius:8px}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:12px;border-bottom:1px solid #e7ebf0}button,input,select{padding:10px;border:1px solid #dfe5ee;border-radius:5px;font:inherit}button{cursor:pointer;color:#2166df;background:white}form{display:flex;gap:10px;flex-wrap:wrap}label{display:grid;gap:6px;font-size:13px}footer,p{color:#657084}#error{color:#ab4a12}small{display:block;margin:10px 0}</style><h1>roomly.</h1><p>TRYB DEMO · Role są symulacją, nie zabezpieczeniem. Dane znikają po odświeżeniu.</p><label>Rola<select id="role"><option value="employee">Pracownik</option><option value="admin">Administrator</option></select></label><section><h2>Sale konferencyjne</h2><table><thead><tr><th>Sala</th><th>Miejsca</th><th>Status</th><th></th></tr></thead><tbody id="rooms"></tbody></table></section><section><h2>Rezerwacje</h2><table><thead><tr><th>Sala</th><th>Użytkownik</th><th>Godziny</th></tr></thead><tbody id="reservations"></tbody></table></section><section><h2>Nowa rezerwacja</h2><form id="booking"><label>Sala<select id="booking-room"></select></label><label>Od<input id="start" type="time" value="11:00" required></label><label>Do<input id="end" type="time" value="12:00" required></label><button>Zarezerwuj</button></form></section><p id="error" role="alert"></p><footer>Roomly · v2 · WSB Merito · Dane fikcyjne</footer><script>
const rooms=[{id:'A101',name:'Sala A101',capacity:20,active:true},{id:'B202',name:'Sala B202',capacity:10,active:true}];
const reservations=[{room:'A101',user:'TEST-U01',start:'10:00',end:'11:00'},{room:'A101',user:'TEST-U02',start:'12:00',end:'13:00'},{room:'B202',user:'TEST-U01',start:'09:00',end:'10:00'}];
function cell(tr,text){const td=document.createElement('td');td.textContent=text;tr.append(td);return td;}
function render(){document.querySelector('#rooms').replaceChildren();rooms.forEach(r=>{const tr=document.createElement('tr');cell(tr,r.name);cell(tr,r.capacity);cell(tr,r.active?'Aktywna':'Nieaktywna');const td=cell(tr,''); document.querySelector('#rooms').append(tr);});document.querySelector('#reservations').replaceChildren();reservations.forEach(r=>{const tr=document.createElement('tr');cell(tr,'Sala '+r.room);cell(tr,r.user);cell(tr,r.start+'–'+r.end);document.querySelector('#reservations').append(tr);});const select=document.querySelector('#booking-room');select.replaceChildren();rooms.filter(r=>r.active).forEach(r=>{const option=document.createElement('option');option.value=r.id;option.textContent=r.name;select.append(option);});}
document.querySelector('#role').onchange=render;document.querySelector('#booking').onsubmit=e=>{e.preventDefault();const room=document.querySelector('#booking-room').value,start=document.querySelector('#start').value,end=document.querySelector('#end').value;const error=document.querySelector('#error');if(end<=start){error.textContent='Koniec musi być późniejszy niż początek.';return;}if(reservations.some(r=>r.room===room&&start<r.end&&end>r.start)){error.textContent='Konflikt: sala jest zajęta w tym terminie.';return;}reservations.push({room,user:'TEST-U01',start,end});error.textContent='Rezerwacja dodana w demo.';render();}; render();</script></html>
